name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Lint is platform-independent, so it runs once instead of on every target.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
            uname: arm64
          - target: linux-x86_64
            runner: ubuntu-24.04
            uname: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            perl \
            pkg-config

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Test
        run: cargo test --locked --all-features

      # Release is required here: the bundled-database check below asserts on
      # the artifact that actually ships.
      - name: Build
        run: cargo build --locked --release --bin tg

      - name: Verify CLI
        run: ./target/release/tg --help

      - name: Verify bundled database provider
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            ! ldd target/release/tg | grep -E 'lib(sqlite3|sqlcipher|crypto|ssl)'
          else
            ! otool -L target/release/tg | grep -E 'lib(sqlite3|sqlcipher|crypto|ssl)'
          fi
