name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Formatting is platform-independent, so it runs once.
  lint:
    name: gofmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal e2e)"

  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
            uname: arm64
          - target: linux-x86_64
            runner: ubuntu-24.04
            uname: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o target/tg ./cmd/tg

      - name: Test
        run: TG_BIN="$PWD/target/tg" go test -count=1 ./...

      - name: Verify bundled database provider
        run: |
          ./target/tg --help >/dev/null
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            ! ldd target/tg | grep -E 'lib(sqlite3|sqlcipher|crypto|ssl)'
          else
            ! otool -L target/tg | grep -E 'lib(sqlite3|sqlcipher|crypto|ssl)'
          fi
