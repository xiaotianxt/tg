name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-macos:
    name: build (darwin-arm64)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Build
        run: cargo build --release --bin tg

      - name: Verify binary
        run: |
          target/release/tg --help >/dev/null
          ! otool -L target/release/tg | grep -E 'lib(sqlite3|sqlcipher|crypto|ssl)'

      - name: Archive
        run: |
          mkdir -p archive
          cp target/release/tg LICENSE THIRD_PARTY_LICENSES archive/
          tar -C archive -czf tg-${{ github.ref_name }}-darwin-arm64.tar.gz \
            tg LICENSE THIRD_PARTY_LICENSES

      - uses: actions/upload-artifact@v7
        with:
          name: tg-${{ github.ref_name }}-darwin-arm64
          path: tg-${{ github.ref_name }}-darwin-arm64.tar.gz

  build-linux:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            uname: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            perl \
            pkg-config

      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Build
        run: cargo build --release --bin tg

      - name: Verify binary and glibc floor
        run: |
          target/release/tg --help >/dev/null
          ! ldd target/release/tg | grep -E 'lib(sqlite3|sqlcipher|crypto|ssl)'
          ! readelf --version-info target/release/tg | grep -Eq 'GLIBC_2\.(3[6-9]|[4-9][0-9]|[1-9][0-9]{2,})|GLIBC_[3-9]'

      - name: Archive
        run: |
          mkdir -p archive
          cp target/release/tg LICENSE THIRD_PARTY_LICENSES archive/
          tar -C archive -czf tg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            tg LICENSE THIRD_PARTY_LICENSES

      - uses: actions/upload-artifact@v7
        with:
          name: tg-${{ github.ref_name }}-${{ matrix.target }}
          path: tg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: tg-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: tg-*.tar.gz
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
